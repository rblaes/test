<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockout 3D</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="hud">
      <div class="panel">
        <span>Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="panel">
        <span>Lives</span>
        <strong id="lives">3</strong>
      </div>
    </div>

    <div id="message" aria-live="polite">
      <h1>Blockout 3D</h1>
      <p>Press Space to launch the ball</p>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
